[project]
name = "wm-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Michael J. Fordham", email = "45635197+MichaelJFordham@users.noreply.github.com" }
]
requires-python = ">=3.15"
